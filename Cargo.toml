[workspace]
resolver = "3"
members = ["crates/tauri-wd"]
exclude = ["tests/fixture/src-tauri"]

[workspace.package]
version = "0.1.5"
edition = "2024"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/zhom/tauri-wd"
homepage = "https://zhom.github.io/tauri-wd/"
authors = ["Internet Technology Services LLC"]

[workspace.dependencies]
async-trait = "0.1.89"
axum = "0.8.9"
base64 = "0.23.0"
clap = { version = "4.6.2", features = ["derive"] }
futures-util = "0.3.33"
image = { version = "0.25.10", default-features = false, features = ["png"] }
process-wrap = { version = "9.1.0", default-features = false }
reqwest = { version = "0.13.4", default-features = false, features = [
    "json",
    "stream",
] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tauri = "2.11.5"
tempfile = "3.27.0"
thiserror = "2.0.18"
tokio = { version = "1.53.0", features = [
    "fs",
    "io-util",
    "macros",
    "net",
    "process",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tower = { version = "0.5.3", features = ["util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
uuid = { version = "1.24.0", features = ["v4"] }

[profile.release]
lto = "thin"
strip = true

name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: taiki-e/install-action@899b013517f9e7774591216672bf75a46bb9a481 # v2.9.4
        with:
          tool: cargo-audit@0.22.2
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Verify tag
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          test "v$version" = "$GITHUB_REF_NAME"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-features --locked
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --all-features --no-deps --locked
      - run: cargo audit
      - run: node --check site/site.js
      - run: npx --yes prettier@3.6.2 --check "site/*.{html,css,js}"
      - run: test -s site/social-card.png
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: 1.90.0
      - run: cargo +1.90.0 check --workspace --all-targets --all-features --locked
      - name: Preflight packages
        run: |
          cargo +stable publish -p tauri-plugin-cross-platform-webdriver --locked --dry-run
          cargo +stable publish -p tauri-cross-platform-webdriver --locked --dry-run

  binaries:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            artifact: tauri-wd-aarch64-apple-darwin
            archive: tauri-wd-aarch64-apple-darwin.tar.gz
            binary: target/release/tauri-wd
            target: aarch64-apple-darwin
          - os: macos-15-intel
            artifact: tauri-wd-x86_64-apple-darwin
            archive: tauri-wd-x86_64-apple-darwin.tar.gz
            binary: target/release/tauri-wd
            target: x86_64-apple-darwin
          - os: ubuntu-24.04
            artifact: tauri-wd-x86_64-unknown-linux-gnu
            archive: tauri-wd-x86_64-unknown-linux-gnu.tar.gz
            binary: target/release/tauri-wd
            target: x86_64-unknown-linux-gnu
          - os: windows-2025
            artifact: tauri-wd-x86_64-pc-windows-msvc
            archive: tauri-wd-x86_64-pc-windows-msvc.zip
            binary: target/release/tauri-wd.exe
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
      - uses: taiki-e/install-action@3d7d7cd5ac7f994c1892ae0c06165095b9139094 # v2.85.1
        with:
          tool: cargo-about@0.8.4
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev xvfb
      - run: cargo test --workspace --all-features --locked
      - name: Test macOS
        if: runner.os == 'macOS'
        run: bash tests/e2e-smoke.sh
      - name: Test Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a bash tests/e2e-smoke.sh
      - name: Test Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/e2e-smoke.ps1
      - run: cargo build --release --locked -p tauri-cross-platform-webdriver
      - name: Generate third-party licenses
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: bash .github/scripts/generate-third-party-licenses.sh "$TARGET" THIRD_PARTY_LICENSES.md
      - name: Package Unix binary
        if: runner.os != 'Windows'
        env:
          ARTIFACT: ${{ matrix.artifact }}
          BINARY: ${{ matrix.binary }}
        run: |
          mkdir "$ARTIFACT"
          install -m 755 "$BINARY" "$ARTIFACT/tauri-wd"
          install -m 644 LICENSE README.md THIRD_PARTY_LICENSES.md "$ARTIFACT/"
          (
            cd "$ARTIFACT"
            if command -v sha256sum >/dev/null; then
              sha256sum tauri-wd LICENSE README.md THIRD_PARTY_LICENSES.md
            else
              shasum -a 256 tauri-wd LICENSE README.md THIRD_PARTY_LICENSES.md
            fi >SHA256SUMS.txt
          )
          tar -czf "$ARTIFACT.tar.gz" "$ARTIFACT"
      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ARTIFACT: ${{ matrix.artifact }}
          BINARY: ${{ matrix.binary }}
        run: |
          New-Item -ItemType Directory -Path $env:ARTIFACT
          Copy-Item $env:BINARY "$env:ARTIFACT/tauri-wd.exe"
          Copy-Item LICENSE $env:ARTIFACT
          Copy-Item README.md $env:ARTIFACT
          Copy-Item THIRD_PARTY_LICENSES.md $env:ARTIFACT
          $files = @("tauri-wd.exe", "LICENSE", "README.md", "THIRD_PARTY_LICENSES.md")
          $sums = foreach ($file in $files) {
            $hash = (Get-FileHash "$env:ARTIFACT/$file" -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $file"
          }
          $sums | Set-Content "$env:ARTIFACT/SHA256SUMS.txt" -Encoding ascii
          Compress-Archive -Path $env:ARTIFACT -DestinationPath "$env:ARTIFACT.zip"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

  publish:
    needs: [verify, binaries]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
      - name: Select crates.io authentication
        id: crates_io_auth_mode
        env:
          CRATES_IO_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: |
          if [ -z "$CRATES_IO_TOKEN" ]; then
            echo "use_oidc=true" >>"$GITHUB_OUTPUT"
          else
            echo "use_oidc=false" >>"$GITHUB_OUTPUT"
          fi
      - name: Get crates.io token
        if: steps.crates_io_auth_mode.outputs.use_oidc == 'true'
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: crates_io_auth
      - name: Publish crates
        env:
          CRATES_IO_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
          OIDC_TOKEN: ${{ steps.crates_io_auth.outputs.token }}
        run: |
          set -euo pipefail
          export CARGO_REGISTRY_TOKEN="${CRATES_IO_TOKEN:-$OIDC_TOKEN}"
          test -n "$CARGO_REGISTRY_TOKEN"
          version="${GITHUB_REF_NAME#v}"
          cargo package -p tauri-plugin-cross-platform-webdriver --locked --no-verify
          cargo package -p tauri-cross-platform-webdriver --locked --no-verify

          publication_state() {
            local crate="$1"
            local http_code
            if ! http_code="$(curl --silent --show-error \
              --user-agent "tauri-wg-release/$GITHUB_SHA" \
              --output /dev/null \
              --write-out '%{http_code}' \
              "https://crates.io/api/v1/crates/$crate/$version")"; then
              echo "crates.io request failed for $crate" >&2
              return 1
            fi
            case "$http_code" in
              200) echo published ;;
              404) echo missing ;;
              *)
                echo "crates.io returned HTTP $http_code for $crate" >&2
                return 1
                ;;
            esac
          }

          verify_published_checksum() {
            local crate="$1"
            local local_checksum
            local published_checksum
            local_checksum="$(sha256sum "target/package/$crate-$version.crate" | cut -d ' ' -f 1)"
            published_checksum="$(curl --fail --silent --show-error \
              --user-agent "tauri-wg-release/$GITHUB_SHA" \
              "https://crates.io/api/v1/crates/$crate/$version" \
              | jq --exit-status --raw-output '.version.checksum')"
            if [ "$local_checksum" != "$published_checksum" ]; then
              echo "$crate $version checksum differs from the tag" >&2
              return 1
            fi
          }

          publish_if_missing() {
            local crate="$1"
            local state
            state="$(publication_state "$crate")"
            if [ "$state" = published ]; then
              verify_published_checksum "$crate"
              echo "$crate $version already published"
              return
            fi

            for attempt in 1 2 3; do
              cargo publish -p "$crate" --locked || true
              for _ in $(seq 1 30); do
                state="$(publication_state "$crate")"
                if [ "$state" = published ]; then
                  verify_published_checksum "$crate"
                  return
                fi
                sleep 2
              done
              echo "$crate publish attempt $attempt failed" >&2
            done
            echo "$crate $version was not visible on crates.io" >&2
            return 1
          }

          publish_if_missing tauri-plugin-cross-platform-webdriver
          publish_if_missing tauri-cross-platform-webdriver
          test "$(publication_state tauri-plugin-cross-platform-webdriver)" = published
          test "$(publication_state tauri-cross-platform-webdriver)" = published

  github-release:
    needs: [verify, binaries, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Generate checksums
        run: |
          cd dist
          shopt -s nullglob
          archives=(tauri-wd-*.tar.gz tauri-wd-*.zip)
          test "${#archives[@]}" -eq 4
          sha256sum "${archives[@]}" >SHA256SUMS.txt
      - name: Generate changelog
        run: bash .github/scripts/generate-changelog.sh "$GITHUB_REF_NAME" /tmp/release-changelog.md
      - name: Inspect release
        id: release_state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "state=missing" >>"$GITHUB_OUTPUT"
          elif [ "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft' --repo "$GITHUB_REPOSITORY")" = true ]; then
            echo "state=draft" >>"$GITHUB_OUTPUT"
          else
            echo "state=public" >>"$GITHUB_OUTPUT"
          fi
      - uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        if: steps.release_state.outputs.state != 'public'
        with:
          subject-path: |
            dist/tauri-wd-*
            dist/SHA256SUMS.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          verify_assets() {
            local expected_names
            local published_names
            local download_dir="$RUNNER_TEMP/release-assets"
            expected_names="$(find dist -maxdepth 1 -type f -printf '%f\n' | sort)"
            published_names="$(gh release view "$GITHUB_REF_NAME" \
              --json assets \
              --jq '.assets[].name' \
              --repo "$GITHUB_REPOSITORY" \
              | sort)"
            if [ "$expected_names" != "$published_names" ]; then
              echo "release assets differ from the tag build" >&2
              return 1
            fi
            mkdir "$download_dir"
            gh release download "$GITHUB_REF_NAME" \
              --dir "$download_dir" \
              --repo "$GITHUB_REPOSITORY"
            for file in dist/*; do
              cmp "$file" "$download_dir/${file##*/}"
            done
          }

          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            is_draft="$(gh release view "$GITHUB_REF_NAME" \
              --json isDraft \
              --jq '.isDraft' \
              --repo "$GITHUB_REPOSITORY")"
            if [ "$is_draft" = false ]; then
              verify_assets
              expected_notes="$(cat /tmp/release-changelog.md)"
              published_notes="$(gh release view "$GITHUB_REF_NAME" \
                --json body \
                --jq '.body' \
                --repo "$GITHUB_REPOSITORY")"
              if [ "$expected_notes" != "$published_notes" ]; then
                echo "release notes differ from the tag" >&2
                exit 1
              fi
              exit
            fi
          else
            gh release create "$GITHUB_REF_NAME" \
              --draft \
              --notes-file /tmp/release-changelog.md \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag
          fi
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          verify_assets
          gh release edit "$GITHUB_REF_NAME" \
            --draft=false \
            --notes-file /tmp/release-changelog.md \
            --repo "$GITHUB_REPOSITORY"

  changelog:
    needs: github-release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main
          fetch-depth: 0
      - name: Update changelog
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          if grep -q "^## $version (" CHANGELOG.md; then
            exit
          fi
          bash .github/scripts/generate-changelog.sh "$TAG" /tmp/release-changelog.md
          tail -n +2 CHANGELOG.md | sed '/./,$!d' >/tmp/previous-changelog.md
          {
            echo "# Changelog"
            echo
            cat /tmp/release-changelog.md
            if [ -s /tmp/previous-changelog.md ]; then
              echo
              cat /tmp/previous-changelog.md
            fi
          } >CHANGELOG.tmp
          mv CHANGELOG.tmp CHANGELOG.md
      - name: Create changelog pull request
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if git diff --quiet -- CHANGELOG.md; then
            exit
          fi
          branch="docs/changelog-${TAG#v}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            git fetch origin "$branch:refs/remotes/origin/$branch"
          fi
          git checkout -B "$branch"
          git add CHANGELOG.md
          git commit -m "docs: update changelog for $TAG"
          git push --force-with-lease origin "$branch"
          open_prs="$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --head "$branch" \
            --json number \
            --jq 'length')"
          if [ "$open_prs" -eq 0 ]; then
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head "$branch" \
              --title "docs: changelog for $TAG" \
              --body "Generated from release commits."
          fi
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$branch"

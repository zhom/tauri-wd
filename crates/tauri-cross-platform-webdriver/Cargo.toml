[package]
name = "tauri-cross-platform-webdriver"
description = "Cross-platform W3C WebDriver server and app launcher for Tauri"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
documentation = "https://docs.rs/tauri-cross-platform-webdriver"
readme = "../../README.md"
keywords = ["tauri", "webdriver", "selenium", "testing", "e2e"]
categories = ["development-tools::testing", "web-programming"]

[[bin]]
name = "tauri-wd"
path = "src/main.rs"

[dependencies]
async-trait.workspace = true
axum.workspace = true
clap.workspace = true
futures-util.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[target.'cfg(unix)'.dependencies]
process-wrap = { workspace = true, features = [
    "kill-on-drop",
    "process-group",
    "tokio1",
] }

[target.'cfg(windows)'.dependencies]
process-wrap = { workspace = true, features = [
    "job-object",
    "kill-on-drop",
    "tokio1",
] }

[dev-dependencies]
tower.workspace = true

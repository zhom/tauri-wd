[package]
name = "tauri-plugin-cross-platform-webdriver"
description = "Native cross-platform WebDriver plugin for Tauri applications"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
documentation = "https://docs.rs/tauri-plugin-cross-platform-webdriver"
readme = "../../README.md"
keywords = ["tauri", "webdriver", "testing", "automation", "e2e"]
categories = ["development-tools::testing", "gui"]
links = "tauri-plugin-cross-platform-webdriver"

[dependencies]
async-trait.workspace = true
axum.workspace = true
base64.workspace = true
image.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri.workspace = true
tempfile.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", features = [
    "NSBitmapImageRep",
    "NSImage",
    "NSImageRep",
] }
objc2-foundation = { version = "0.3.2", features = [
    "NSArray",
    "NSData",
    "NSDictionary",
    "NSError",
    "NSString",
] }
objc2-web-kit = { version = "0.3.2", features = [
    "WKContentWorld",
    "WKFrameInfo",
    "WKPDFConfiguration",
    "WKSnapshotConfiguration",
    "WKUIDelegate",
    "WKWebView",
    "block2",
    "objc2-app-kit",
] }

[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "0.39.1"
windows = { version = "0.62.2", features = [
    "Win32_System_Com",
    "Win32_System_WinRT",
] }
windows-core = "0.62.2"

[target.'cfg(target_os = "linux")'.dependencies]
cairo-rs = { version = "0.21.5", features = ["png"] }
glib = "0.21.5"
gtk = "0.18.2"
javascriptcore-rs = "1.1.2"
webkit2gtk = "2.0.2"

[build-dependencies]
tauri-plugin = { version = "2.6.3", features = ["build"] }
